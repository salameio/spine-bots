<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spine Bots — AI Bot Idea Generator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a0f;
            --surface: #13131a;
            --surface-2: #1a1a24;
            --border: #2a2a3a;
            --text: #e8e8f0;
            --text-muted: #8888a0;
            --accent: #6c5ce7;
            --accent-light: #a29bfe;
            --accent-glow: rgba(108, 92, 231, 0.3);
            --success: #00cec9;
            --success-glow: rgba(0, 206, 201, 0.3);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-grid {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(108, 92, 231, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(108, 92, 231, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none; z-index: 0;
        }

        .bg-glow {
            position: fixed; width: 600px; height: 600px; border-radius: 50%;
            filter: blur(150px); opacity: 0.15; pointer-events: none; z-index: 0;
        }
        .bg-glow-1 { top: -200px; right: -100px; background: var(--accent); }
        .bg-glow-2 { bottom: -200px; left: -100px; background: var(--success); }

        .app {
            position: relative; z-index: 1; max-width: 720px;
            margin: 0 auto; padding: 40px 24px; min-height: 100vh;
            display: flex; flex-direction: column;
        }

        .header { text-align: center; margin-bottom: 48px; }

        .logo {
            display: inline-flex; align-items: center; gap: 12px; margin-bottom: 16px;
        }
        .logo-icon {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, var(--accent), var(--success));
            border-radius: 14px; display: flex; align-items: center;
            justify-content: center; font-size: 24px;
        }
        .logo-text { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
        .logo-text span { color: var(--accent-light); }

        .header p {
            color: var(--text-muted); font-size: 16px; line-height: 1.6;
            max-width: 500px; margin: 0 auto;
        }

        .progress-container { margin-bottom: 40px; }
        .progress-info {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
        }
        .progress-label { font-size: 13px; color: var(--text-muted); font-weight: 500; }
        .progress-count { font-size: 13px; color: var(--accent-light); font-weight: 600; }
        .progress-bar {
            height: 4px; background: var(--surface-2); border-radius: 4px; overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--success));
            border-radius: 4px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .question-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 20px; padding: 40px; margin-bottom: 24px;
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-number {
            font-size: 12px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 2px; color: var(--accent-light); margin-bottom: 12px;
        }
        .question-text {
            font-size: 22px; font-weight: 600; line-height: 1.4;
            margin-bottom: 8px; letter-spacing: -0.3px;
        }
        .question-subtitle {
            font-size: 14px; color: var(--text-muted); margin-bottom: 28px; line-height: 1.5;
        }

        .options { display: flex; flex-direction: column; gap: 10px; }

        .option {
            display: flex; align-items: center; gap: 14px; padding: 16px 20px;
            background: var(--surface-2); border: 1px solid var(--border);
            border-radius: 14px; cursor: pointer; transition: all 0.2s ease;
            font-size: 15px; font-weight: 500; color: var(--text);
            text-align: left; width: 100%; font-family: inherit;
        }
        .option:hover {
            border-color: var(--accent); background: rgba(108, 92, 231, 0.08);
            transform: translateX(4px);
        }
        .option-letter {
            width: 32px; height: 32px; min-width: 32px; border-radius: 9px;
            background: rgba(108, 92, 231, 0.15); color: var(--accent-light);
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700;
        }
        .option:hover .option-letter { background: var(--accent); color: white; }

        /* Custom input */
        .custom-input-wrapper {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        .custom-input-label {
            font-size: 13px; color: var(--text-muted); font-weight: 500;
            margin-bottom: 10px; display: block;
        }
        .custom-input-row {
            display: flex; gap: 10px;
        }
        .custom-input {
            flex: 1; padding: 14px 18px; background: var(--surface-2);
            border: 1px solid var(--border); border-radius: 12px;
            color: var(--text); font-size: 14px; font-family: inherit;
            outline: none; transition: border-color 0.2s;
        }
        .custom-input::placeholder { color: var(--text-muted); opacity: 0.6; }
        .custom-input:focus { border-color: var(--accent); }
        .custom-submit {
            padding: 14px 20px; background: linear-gradient(135deg, var(--accent), #5a4bd1);
            border: none; border-radius: 12px; color: white; font-size: 14px;
            font-weight: 600; cursor: pointer; font-family: inherit;
            transition: all 0.2s; white-space: nowrap;
        }
        .custom-submit:hover { transform: translateY(-1px); box-shadow: 0 4px 16px var(--accent-glow); }
        .custom-submit:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

        /* Back button */
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 10px 18px; background: var(--surface-2);
            border: 1px solid var(--border); border-radius: 10px;
            color: var(--text-muted); font-size: 13px; font-weight: 600;
            cursor: pointer; font-family: inherit; transition: all 0.2s;
            margin-bottom: 20px;
        }
        .back-btn:hover {
            border-color: var(--accent); color: var(--text);
            background: rgba(108, 92, 231, 0.08);
        }

        /* Summary */
        .summary-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 20px; padding: 40px;
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .summary-badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(0, 206, 201, 0.1); border: 1px solid rgba(0, 206, 201, 0.2);
            color: var(--success); padding: 6px 14px; border-radius: 100px;
            font-size: 13px; font-weight: 600; margin-bottom: 20px;
        }
        .bot-name {
            font-size: 28px; font-weight: 800; margin-bottom: 8px;
            background: linear-gradient(135deg, var(--accent-light), var(--success));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; letter-spacing: -0.5px;
        }
        .bot-tagline {
            font-size: 16px; color: var(--text-muted); margin-bottom: 28px; line-height: 1.5;
        }
        .summary-section { margin-bottom: 24px; }
        .summary-section-title {
            font-size: 12px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 2px; color: var(--accent-light); margin-bottom: 10px;
        }
        .summary-section p, .summary-section li {
            font-size: 15px; line-height: 1.7; color: var(--text-muted);
        }
        .summary-section ul { list-style: none; padding: 0; }
        .summary-section li {
            padding: 6px 0; padding-left: 20px; position: relative;
        }
        .summary-section li::before {
            content: '\2192'; position: absolute; left: 0; color: var(--accent-light);
        }

        .user-notes-section {
            background: var(--surface-2); border: 1px solid var(--border);
            border-radius: 14px; padding: 20px; margin-bottom: 24px;
        }
        .user-notes-section .summary-section-title { margin-bottom: 12px; }
        .user-note-item {
            padding: 8px 0; font-size: 14px; color: var(--text-muted);
            border-bottom: 1px solid rgba(42,42,58,0.5); line-height: 1.5;
        }
        .user-note-item:last-child { border-bottom: none; }
        .user-note-item strong { color: var(--accent-light); font-weight: 600; }

        .actions { display: flex; gap: 12px; margin-top: 32px; flex-wrap: wrap; }
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 14px 24px; border-radius: 12px; font-size: 14px;
            font-weight: 600; cursor: pointer; transition: all 0.2s;
            font-family: inherit; border: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #5a4bd1);
            color: white; box-shadow: 0 4px 20px var(--accent-glow);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 30px var(--accent-glow); }
        .btn-secondary {
            background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
        }
        .btn-secondary:hover { border-color: var(--accent); background: rgba(108, 92, 231, 0.08); }

        .answer-trail { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
        .trail-chip {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 12px; background: var(--surface-2);
            border: 1px solid var(--border); border-radius: 100px;
            font-size: 12px; color: var(--text-muted); font-weight: 500;
        }
        .trail-chip .trail-label { color: var(--accent-light); font-weight: 600; }

        .welcome { text-align: center; padding: 60px 20px; }
        .welcome h1 {
            font-size: 40px; font-weight: 800; letter-spacing: -1px;
            margin-bottom: 16px; line-height: 1.2;
        }
        .welcome h1 span {
            background: linear-gradient(135deg, var(--accent-light), var(--success));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .welcome p {
            color: var(--text-muted); font-size: 17px; line-height: 1.7;
            max-width: 480px; margin: 0 auto 40px;
        }
        .team-select {
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
            max-width: 500px; margin: 0 auto;
        }
        .team-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 20px; padding: 32px 24px; cursor: pointer;
            transition: all 0.3s ease; text-align: center;
        }
        .team-card:hover {
            border-color: var(--accent); transform: translateY(-4px);
            box-shadow: 0 8px 40px var(--accent-glow);
        }
        .team-icon { font-size: 40px; margin-bottom: 16px; }
        .team-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
        .team-card p { font-size: 13px; color: var(--text-muted); line-height: 1.4; margin: 0; }

        .thinking {
            text-align: center; padding: 60px 20px; animation: slideUp 0.4s ease;
        }
        .thinking-dots {
            display: flex; gap: 8px; justify-content: center; margin-bottom: 24px;
        }
        .thinking-dot {
            width: 12px; height: 12px; background: var(--accent);
            border-radius: 50%; animation: bounce 1.4s infinite ease-in-out;
        }
        .thinking-dot:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        .thinking p { color: var(--text-muted); font-size: 16px; font-weight: 500; }

        .toast {
            position: fixed; bottom: 40px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--success); color: var(--bg);
            padding: 12px 24px; border-radius: 12px; font-size: 14px;
            font-weight: 600; opacity: 0; transition: all 0.3s ease;
            pointer-events: none; z-index: 100;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media (max-width: 600px) {
            .app { padding: 24px 16px; }
            .question-card, .summary-card { padding: 28px 20px; }
            .welcome h1 { font-size: 28px; }
            .team-select { grid-template-columns: 1fr; }
            .question-text { font-size: 18px; }
            .bot-name { font-size: 22px; }
            .actions { flex-direction: column; }
            .btn { justify-content: center; }
            .custom-input-row { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="app" id="app"></div>
    <div class="toast" id="toast">Copied to clipboard!</div>

    <script>
    // ─── Question Engine ───
    const QUESTIONS = {
        // ── CREATIVE TRACK ──
        creative_role: {
            text: "What best describes your role?",
            subtitle: "This helps us understand your day-to-day context.",
            customPlaceholder: "Or describe your role in your own words...",
            options: [
                { label: "Copywriter / Content Creator", next: "creative_challenge", tags: ["role:copywriter"] },
                { label: "Graphic / Visual Designer", next: "creative_challenge", tags: ["role:designer"] },
                { label: "Art Director / Creative Lead", next: "creative_challenge", tags: ["role:art_director"] },
                { label: "Video / Motion Designer", next: "creative_challenge", tags: ["role:video"] },
                { label: "Social Media Specialist", next: "creative_challenge", tags: ["role:social"] }
            ]
        },
        creative_challenge: {
            text: "What's the biggest challenge you face regularly?",
            subtitle: "Think about what slows you down or frustrates you most.",
            customPlaceholder: "Or describe your challenge...",
            options: [
                { label: "Coming up with fresh ideas under tight deadlines", next: "creative_ideation_freq", tags: ["challenge:ideation"] },
                { label: "Repetitive tasks that eat into creative time", next: "creative_repetitive_what", tags: ["challenge:repetitive"] },
                { label: "Managing feedback and revision rounds", next: "creative_feedback_pain", tags: ["challenge:feedback"] },
                { label: "Keeping up with trends and competitor work", next: "creative_research_scope", tags: ["challenge:research"] },
                { label: "Adapting content across multiple formats/platforms", next: "creative_adaptation_type", tags: ["challenge:adaptation"] },
                { label: "Collaborating with client servicing / other teams", next: "creative_collab_pain", tags: ["challenge:collaboration"] },
                { label: "Quality control and brand consistency", next: "creative_qc_what", tags: ["challenge:quality_control"] }
            ]
        },

        // Ideation branch
        creative_ideation_freq: {
            text: "How often do you need to generate new creative concepts?",
            subtitle: "Frequency helps us understand the scale of the problem.",
            customPlaceholder: "Or describe your situation...",
            options: [
                { label: "Multiple times a day — it's relentless", next: "creative_ideation_type", tags: ["freq:very_high"] },
                { label: "A few times a week for different clients", next: "creative_ideation_type", tags: ["freq:high"] },
                { label: "Weekly, but each one requires deep thinking", next: "creative_ideation_type", tags: ["freq:moderate"] }
            ]
        },
        creative_ideation_type: {
            text: "What kind of ideation do you struggle with most?",
            customPlaceholder: "Or describe what you struggle with...",
            options: [
                { label: "Campaign concepts and big ideas", next: "creative_ideation_input", tags: ["ideation:campaigns"] },
                { label: "Social media content angles", next: "creative_ideation_input", tags: ["ideation:social"] },
                { label: "Headlines, taglines, and copy hooks", next: "creative_ideation_input", tags: ["ideation:copy"] },
                { label: "Visual concepts and mood directions", next: "creative_ideation_input", tags: ["ideation:visual"] },
                { label: "Video/motion concepts and storyboards", next: "creative_ideation_input", tags: ["ideation:video"] },
                { label: "Naming — product names, campaign names, brand names", next: "creative_ideation_input", tags: ["ideation:naming"] }
            ]
        },
        creative_ideation_input: {
            text: "What do you usually start with when brainstorming?",
            customPlaceholder: "Or describe your starting point...",
            options: [
                { label: "A client brief with objectives", next: "creative_output_pref", tags: ["input:brief"] },
                { label: "A competitor reference or inspiration", next: "creative_output_pref", tags: ["input:reference"] },
                { label: "A blank page — that's the problem", next: "creative_output_pref", tags: ["input:blank"] },
                { label: "Past work I want to improve upon", next: "creative_output_pref", tags: ["input:past_work"] },
                { label: "Data or audience insights", next: "creative_output_pref", tags: ["input:data"] }
            ]
        },

        // Repetitive tasks branch
        creative_repetitive_what: {
            text: "Which repetitive task drains you the most?",
            customPlaceholder: "Or describe the task...",
            options: [
                { label: "Resizing and reformatting assets for different platforms", next: "creative_repetitive_volume", tags: ["repetitive:resizing"] },
                { label: "Writing variations of the same copy", next: "creative_repetitive_volume", tags: ["repetitive:copy_variations"] },
                { label: "Organizing and tagging files and assets", next: "creative_repetitive_volume", tags: ["repetitive:organizing"] },
                { label: "Creating reports or status updates", next: "creative_repetitive_volume", tags: ["repetitive:reporting"] },
                { label: "Setting up templates and master files", next: "creative_repetitive_volume", tags: ["repetitive:templates"] },
                { label: "Captioning and subtitling videos", next: "creative_repetitive_volume", tags: ["repetitive:captioning"] },
                { label: "Scheduling and publishing content", next: "creative_repetitive_volume", tags: ["repetitive:scheduling"] }
            ]
        },
        creative_repetitive_volume: {
            text: "How much time per week do you estimate this eats up?",
            customPlaceholder: "Or give your own estimate...",
            options: [
                { label: "2-4 hours — annoying but manageable", next: "creative_output_pref", tags: ["volume:medium"] },
                { label: "5-10 hours — it's a serious problem", next: "creative_output_pref", tags: ["volume:high"] },
                { label: "10+ hours — it's basically my whole job now", next: "creative_output_pref", tags: ["volume:critical"] }
            ]
        },

        // Feedback branch
        creative_feedback_pain: {
            text: "What's the worst part about the feedback process?",
            customPlaceholder: "Or describe your pain point...",
            options: [
                { label: "Feedback comes scattered across email, Slack, and comments", next: "creative_feedback_who", tags: ["feedback:scattered"] },
                { label: "Contradictory feedback from different stakeholders", next: "creative_feedback_who", tags: ["feedback:contradictory"] },
                { label: "Too many revision rounds before approval", next: "creative_feedback_who", tags: ["feedback:rounds"] },
                { label: "Vague feedback that's hard to act on", next: "creative_feedback_who", tags: ["feedback:vague"] }
            ]
        },
        creative_feedback_who: {
            text: "Who gives you the most feedback?",
            customPlaceholder: "Or describe who...",
            options: [
                { label: "Client servicing / account managers", next: "creative_output_pref", tags: ["feedback_from:cs"] },
                { label: "Clients directly", next: "creative_output_pref", tags: ["feedback_from:client"] },
                { label: "Creative leads / art directors", next: "creative_output_pref", tags: ["feedback_from:creative_lead"] },
                { label: "Multiple stakeholders — it's chaotic", next: "creative_output_pref", tags: ["feedback_from:multiple"] }
            ]
        },

        // Research branch
        creative_research_scope: {
            text: "What kind of research takes the most effort?",
            customPlaceholder: "Or describe what you research...",
            options: [
                { label: "Monitoring competitor campaigns and ads", next: "creative_research_freq", tags: ["research:competitor"] },
                { label: "Tracking social media trends and viral content", next: "creative_research_freq", tags: ["research:trends"] },
                { label: "Finding references and inspiration for pitches", next: "creative_research_freq", tags: ["research:inspiration"] },
                { label: "Analyzing what's working in our own campaigns", next: "creative_research_freq", tags: ["research:analytics"] },
                { label: "Audience research and persona building", next: "creative_research_freq", tags: ["research:audience"] }
            ]
        },
        creative_research_freq: {
            text: "How do you currently do this research?",
            customPlaceholder: "Or describe your process...",
            options: [
                { label: "Manually scrolling through platforms and websites", next: "creative_output_pref", tags: ["method:manual"] },
                { label: "Google searches and saving bookmarks", next: "creative_output_pref", tags: ["method:google"] },
                { label: "Using some tools but it's still time-consuming", next: "creative_output_pref", tags: ["method:tools"] },
                { label: "I don't — I just don't have time", next: "creative_output_pref", tags: ["method:none"] }
            ]
        },

        // Adaptation branch
        creative_adaptation_type: {
            text: "What kind of adaptation do you deal with most?",
            customPlaceholder: "Or describe the adaptation...",
            options: [
                { label: "One campaign → multiple social platforms", next: "creative_adaptation_pain", tags: ["adapt:multi_platform"] },
                { label: "English content → Arabic (or vice versa)", next: "creative_adaptation_pain", tags: ["adapt:bilingual"] },
                { label: "Print assets → digital (or vice versa)", next: "creative_adaptation_pain", tags: ["adapt:format"] },
                { label: "One master creative → client-specific versions", next: "creative_adaptation_pain", tags: ["adapt:versioning"] },
                { label: "Long-form → short-form (or vice versa)", next: "creative_adaptation_pain", tags: ["adapt:length"] }
            ]
        },
        creative_adaptation_pain: {
            text: "What makes the adaptation painful?",
            customPlaceholder: "Or explain in your own words...",
            options: [
                { label: "Each platform has different specs and best practices", next: "creative_output_pref", tags: ["adapt_pain:specs"] },
                { label: "The tone and messaging needs to shift per audience", next: "creative_output_pref", tags: ["adapt_pain:tone"] },
                { label: "It's just tedious busywork, not creative work", next: "creative_output_pref", tags: ["adapt_pain:tedious"] },
                { label: "Quality drops when rushing through adaptations", next: "creative_output_pref", tags: ["adapt_pain:quality"] }
            ]
        },

        // Collaboration branch (NEW)
        creative_collab_pain: {
            text: "What's the hardest part of working with other teams?",
            customPlaceholder: "Or describe the issue...",
            options: [
                { label: "Briefs arrive unclear or incomplete", next: "creative_collab_result", tags: ["collab:bad_briefs"] },
                { label: "Constant back-and-forth on scope and expectations", next: "creative_collab_result", tags: ["collab:scope_creep"] },
                { label: "Misalignment on timelines and priorities", next: "creative_collab_result", tags: ["collab:timelines"] },
                { label: "Creative direction gets diluted by committee", next: "creative_collab_result", tags: ["collab:committee"] }
            ]
        },
        creative_collab_result: {
            text: "What usually happens as a result?",
            customPlaceholder: "Or explain the impact...",
            options: [

                    "Automated report and document generation",
                    "Meeting preparation and follow-up automation",
                    "Cross-client priority management"
                ],
                howItWorks: "AccountAssist integrates with your existing tools and learns your workflow. It handles the operational overhead of account management so you can focus on strategy and client relationships."
            };
        }
    }

    // ─── App State ───
    let state = {
        screen: 'welcome',
        team: null,
        currentQuestion: null,
        questionNumber: 0,
        totalQuestions: 10,
        answers: [],
        tags: [],
        customInputs: [],
        botIdea: null,
        // History for back navigation
        history: []
    };

    function setState(updates) {
        Object.assign(state, updates);
        render();
    }

    // ─── Event Handlers ───
    function selectTeam(team) {
        const firstQuestion = team === 'creative' ? 'creative_role' : 'cs_role';
        setState({
            screen: 'questionnaire',
            team: team,
            currentQuestion: firstQuestion,
            questionNumber: 1,
            tags: [team === 'creative' ? 'team:creative' : 'team:cs'],
            history: [{
                screen: 'welcome',
                team: null,
                currentQuestion: null,
                questionNumber: 0,
                answers: [],
                tags: [],
                customInputs: []
            }]
        });
    }

    function selectOption(option) {
        // Save current state to history
        const historyEntry = {
            screen: state.screen,
            team: state.team,
            currentQuestion: state.currentQuestion,
            questionNumber: state.questionNumber,
            answers: [...state.answers],
            tags: [...state.tags],
            customInputs: [...state.customInputs]
        };

        const newTags = [...state.tags, ...option.tags];
        const newAnswers = [...state.answers, {
            question: QUESTIONS[state.currentQuestion].text,
            answer: option.label,
            questionKey: state.currentQuestion
        }];

        if (option.next === null) {
            setState({
                answers: newAnswers,
                tags: newTags,
                screen: 'thinking',
                history: [...state.history, historyEntry]
            });
            setTimeout(() => {
                const idea = generateBotIdea(state.team, newTags, state.customInputs);
                setState({
                    botIdea: idea,
                    screen: 'result'
                });
            }, 2000);
        } else {
            setState({
                currentQuestion: option.next,
                questionNumber: state.questionNumber + 1,
                answers: newAnswers,
                tags: newTags,
                history: [...state.history, historyEntry]
            });
        }
    }

    function submitCustomInput() {
        const input = document.getElementById('custom-input');
        const value = input ? input.value.trim() : '';
        if (!value) return;

        const historyEntry = {
            screen: state.screen,
            team: state.team,
            currentQuestion: state.currentQuestion,
            questionNumber: state.questionNumber,
            answers: [...state.answers],
            tags: [...state.tags],
            customInputs: [...state.customInputs]
        };

        const q = QUESTIONS[state.currentQuestion];
        const newAnswers = [...state.answers, {
            question: q.text,
            answer: value,
            questionKey: state.currentQuestion,
            isCustom: true
        }];
        const newCustomInputs = [...state.customInputs, {
            question: q.text,
            answer: value
        }];

        // For custom input, follow the first option's next path
        const defaultNext = q.options[0].next;
        const defaultTags = ['custom:input'];

        if (defaultNext === null) {
            setState({
                answers: newAnswers,
                tags: [...state.tags, ...defaultTags],
                customInputs: newCustomInputs,
                screen: 'thinking',
                history: [...state.history, historyEntry]
            });
            setTimeout(() => {
                const idea = generateBotIdea(state.team, state.tags, state.customInputs);
                setState({
                    botIdea: idea,
                    screen: 'result'
                });
            }, 2000);
        } else {
            setState({
                currentQuestion: defaultNext,
                questionNumber: state.questionNumber + 1,
                answers: newAnswers,
                tags: [...state.tags, ...defaultTags],
                customInputs: newCustomInputs,
                history: [...state.history, historyEntry]
            });
        }
    }

    function goBack() {
        if (state.history.length === 0) return;
        const prev = state.history[state.history.length - 1];
        const newHistory = state.history.slice(0, -1);
        setState({
            ...prev,
            history: newHistory,
            botIdea: null
        });
    }

    function startOver() {
        setState({
            screen: 'welcome',
            team: null,
            currentQuestion: null,
            questionNumber: 0,
            answers: [],
            tags: [],
            customInputs: [],
            botIdea: null,
            history: []
        });
    }

    function copyResult() {
        const bot = state.botIdea;
        let text = `BOT IDEA: ${bot.name}\n\n` +
            `"${bot.tagline}"\n\n` +
            `DESCRIPTION:\n${bot.description}\n\n` +
            `KEY FEATURES:\n${bot.features.map(f => '  ' + f).join('\n')}\n\n` +
            `HOW IT WORKS:\n${bot.howItWorks}\n\n` +
            `---\nQuestionnaire Answers:\n${state.answers.map((a, i) => `${i+1}. ${a.question}\n   > ${a.answer}${a.isCustom ? ' (custom input)' : ''}`).join('\n')}`;

        if (state.customInputs.length > 0) {
            text += `\n\n---\nAdditional Notes from User:\n${state.customInputs.map(c => `- ${c.question}: "${c.answer}"`).join('\n')}`;
        }

        navigator.clipboard.writeText(text).then(() => {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        });
    }

    function handleCustomKeydown(e) {
        if (e.key === 'Enter') submitCustomInput();
    }

    // ─── Render ───
    function render() {
        const app = document.getElementById('app');

        let html = `
            <div class="header">
                <div class="logo">
                    <div class="logo-icon">\u26A1</div>
                    <div class="logo-text">Spine <span>Bots</span></div>
                </div>
                <p>Discover the perfect AI bot idea for your workflow. Answer a few smart questions, and we'll suggest a bot tailored to your needs.</p>
            </div>
        `;

        if (state.screen === 'welcome') {
            html += `
                <div class="welcome">
                    <h1>What team are <span>you</span> on?</h1>
                    <p>We'll tailor the questions to your daily work and challenges.</p>
                    <div class="team-select">
                        <div class="team-card" onclick="selectTeam('creative')">
                            <div class="team-icon">\uD83C\uDFA8</div>
                            <h3>Creative Team</h3>
                            <p>Designers, copywriters, art directors, and content creators</p>
                        </div>
                        <div class="team-card" onclick="selectTeam('cs')">
                            <div class="team-icon">\uD83E\uDD1D</div>
                            <h3>Client Servicing</h3>
                            <p>Account managers, project managers, and strategists</p>
                        </div>
                    </div>
                </div>
            `;
        }

        if (state.screen === 'questionnaire') {
            const q = QUESTIONS[state.currentQuestion];
            const progress = (state.questionNumber / state.totalQuestions) * 100;
            const letters = 'ABCDEFGH';

            // Back button
            if (state.history.length > 0) {
                html += `<button class="back-btn" onclick="goBack()">\u2190 Back</button>`;
            }

            // Answer trail
            if (state.answers.length > 0) {
                html += `<div class="answer-trail">`;
                state.answers.forEach(a => {
                    html += `<div class="trail-chip"><span class="trail-label">\u2713</span> ${a.answer.length > 30 ? a.answer.substring(0, 30) + '...' : a.answer}</div>`;
                });
                html += `</div>`;
            }

            // Progress bar
            html += `
                <div class="progress-container">
                    <div class="progress-info">
                        <span class="progress-label">Your bot is taking shape...</span>
                        <span class="progress-count">Question ${state.questionNumber}</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${Math.min(progress, 100)}%"></div>
                    </div>
                </div>
            `;

            // Question card
            html += `
                <div class="question-card">
                    <div class="question-number">Question ${state.questionNumber}</div>
                    <div class="question-text">${q.text}</div>
                    ${q.subtitle ? `<div class="question-subtitle">${q.subtitle}</div>` : '<div style="margin-bottom:28px"></div>'}
                    <div class="options">
                        ${q.options.map((opt, i) => `
                            <button class="option" onclick='selectOption(${JSON.stringify(opt).replace(/'/g, "&#39;")})'>
                                <div class="option-letter">${letters[i]}</div>
                                <span>${opt.label}</span>
                            </button>
                        `).join('')}
                    </div>
                    <div class="custom-input-wrapper">
                        <label class="custom-input-label">${q.customPlaceholder ? 'Or share your own answer:' : 'Or type your own answer:'}</label>
                        <div class="custom-input-row">
                            <input type="text" id="custom-input" class="custom-input"
                                placeholder="${q.customPlaceholder || 'Type your own answer...'}"
                                onkeydown="handleCustomKeydown(event)" />
                            <button class="custom-submit" onclick="submitCustomInput()">Submit</button>
                        </div>
                    </div>
                </div>
            `;
        }

        if (state.screen === 'thinking') {
            html += `
                <div class="thinking">
                    <div class="thinking-dots">
                        <div class="thinking-dot"></div>
                        <div class="thinking-dot"></div>
                        <div class="thinking-dot"></div>
                    </div>
                    <p>Analyzing your answers and crafting the perfect bot idea...</p>
                </div>
            `;
        }

        if (state.screen === 'result') {
            const bot = state.botIdea;

            // Back button on result
            html += `<button class="back-btn" onclick="goBack()">\u2190 Back</button>`;

            // Show custom inputs section if any
            let customSection = '';
            if (state.customInputs.length > 0) {
                customSection = `
                    <div class="user-notes-section">
                        <div class="summary-section-title">Your Custom Notes</div>
                        ${state.customInputs.map(c => `
                            <div class="user-note-item"><strong>${c.question}</strong><br>"${c.answer}"</div>
                        `).join('')}
                    </div>
                `;
            }

            html += `
                <div class="summary-card">
                    <div class="summary-badge">\u2728 Your Bot Idea</div>
                    <div class="bot-name">${bot.name}</div>
                    <div class="bot-tagline">${bot.tagline}</div>

                    <div class="summary-section">
                        <div class="summary-section-title">What It Does</div>
                        <p>${bot.description}</p>
                    </div>

                    <div class="summary-section">
                        <div class="summary-section-title">Key Features</div>
                        <ul>
                            ${bot.features.map(f => `<li>${f}</li>`).join('')}
                        </ul>
                    </div>

                    <div class="summary-section">
                        <div class="summary-section-title">How It Works</div>
                        <p>${bot.howItWorks}</p>
                    </div>

                    ${customSection}

                    <div class="summary-section">
                        <div class="summary-section-title">Your Journey</div>
                        <ul>
                            ${state.answers.map(a => `<li><strong>${a.question}</strong><br>${a.answer}${a.isCustom ? ' <em>(custom)</em>' : ''}</li>`).join('')}
                        </ul>
                    </div>

                    <div class="actions">
                        <button class="btn btn-primary" onclick="copyResult()">\uD83D\uDCCB Copy Bot Idea</button>
                        <button class="btn btn-secondary" onclick="startOver()">\u21BA Start Over</button>
                    </div>
                </div>
            `;
        }

        app.innerHTML = html;

        // Focus custom input if on questionnaire
        if (state.screen === 'questionnaire') {
            const input = document.getElementById('custom-input');
            // Don't auto-focus to avoid scroll jump on mobile
        }
    }

    render();
    </script>
</body>
</html>
